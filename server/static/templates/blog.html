{{ define "blog" }}
{{ .BlogPageTmplMeta.InnerText }}
</div>
{{ if .BlogPageTmplMeta.HasMermaid }}
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script type="module">
  import mermaid from 'The/Path/In/Your/Package/mermaid.esm.mjs';
  mermaid.initialize({ startOnLoad: true });
</script>
{{ end }}
{{ if .BlogPageTmplMeta.HasMathJax }}
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script>
  MathJax = {
    tex: {
      displayMath: [['$$', '$$']],  // block
      inlineMath: [['$', '$']]      // inline
    },
    loader:{
      load: ['ui/safe']
    },
  };
</script>
{{ end }}
{{ end }}
