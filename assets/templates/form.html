<!--
  supports quick and full event form
  format datetime for backend first pass
-->
{{ define "content" }}
<div>
  <form class="eventform" action="{{ .PostEndpoint }}" method="POST">
    <header class="form-header">
      <h2>{{ .FormTitle }}</h2>
    </header>
    <div class="form-group" id="entries-container"></div>
    <button type="button" id="add-btn" style="margin-top: 10px;">+ Add Entry</button>
    <button type="submit" style="margin-top: 20px;">Submit Form</button>
  </form>
</div>

<template id="entry-template">
  <div class="form-group entry-row">
    <div class="field-group">
      <label>Title:</label>
      <input type="text" name="title" required>
    </div>
    <div class="field-group">
      <label for="group">Group:</label>
      <input type="text" id="group" name="group"
        {{ if .IsIdea }}value="idea" readonly
        {{ else if .IsReminder }}value="reminder" readonly
        {{ else if .IsSimple }}value="draft" readonly
        {{ else }}required{{ end }}>
    </div>
    <div class="field-group">
      <label for="url">URL:</label>
      <input type="text" id="url" name="url" value="">
    </div>
    {{ if or .IsTask .IsFull .IsReminder }}
    <div class="field-group date-group">
      <div class="date-input">
        <label for="startDate">Start Date:</label>
        <input type="datetime-local" id="startDate" name="startDate" required>
      </div>
      <div class="date-input">
        <label for="endDate">End Date:</label>
        <input type="datetime-local" id="endDate" name="endDate" required>
      </div>
    </div>
    {{ end }}
    {{ if or .IsTask .IsFull .IsIdea }}
    <div class="field-group-stacked">
      <label>Description:</label>
      <textarea id="description" name="description" rows="3"></textarea>
    </div>
    {{ end }}
    <button type="button" class="btn-remove" onclick="this.closest('.entry-row').remove()">- Remove</button>
  </div>
</template>

<script>
  function addEntryRow() {
    const container = document.getElementById('entries-container');
    const template = document.getElementById('entry-template');
    const clone = template.content.cloneNode(true);
    container.appendChild(clone);
  }
  document.getElementById('add-btn').addEventListener('click', addEntryRow);
  addEntryRow();
</script>
{{ end }}
