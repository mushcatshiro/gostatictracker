{{ define "content" }}
<div>
{{ .InnerText }}
</div>
{{ if .HasMermaid }}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: true });
</script>
{{ end }}
{{ if .HasMathJax }}
<script id="MathJax-script"
  defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script>
  MathJax = {
    tex: {
      displayMath: [['$$', '$$']],  // block
      inlineMath: [['$', '$']]      // inline
    },
    loader:{
      load: ['ui/safe']
    },
  };
</script>
{{ end }}
{{ end }}
