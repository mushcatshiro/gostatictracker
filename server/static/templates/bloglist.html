{{ define "bloglist" }}
<ul>
{{ if .IsAuth }}
  {{ range .Entries }}
  <li>
    <a href="{{ .URL }}">{{ .Title }}</a> {{ .CreateDate }}
    <a href="{{ .EditURL }}" hx-get="{{ .EditURL }}" hx-target="#content" hx-push-url="true">Edit</a>
  </li>
  {{ end }}
{{ else }}
  {{ range .Entries }}
  <li>
    <a href="{{ .URL }}">{{ .Title }}</a> {{ .CreateDate }}
  </li>
  {{ end }}
{{ end }}
</ul>
{{ end }}
